<script>
const firebaseConfig = {
    apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let allMatches = {};

db.ref('matches').once('value').then((snapshot) => {
    allMatches = snapshot.val() || {};
    populateSelectOptions(allMatches);
    // Ha van a kiválasztóban már érték, azonnal rendereljük
    renderSelectedMatch();
}).catch(err => {
    console.error("Adatbázis hiba:", err);
    document.getElementById('archiveSelect').innerHTML = '<option value="">Hiba a betöltéskor!</option>';
});

function populateSelectOptions(matchesObj) {
    const selectEl = document.getElementById('archiveSelect');
    const currentValue = selectEl.value;
    selectEl.innerHTML = '<option value="">-- Válassz mérkőzést --</option>';

    const keys = Object.keys(matchesObj);
    if (keys.length === 0) {
        selectEl.innerHTML = '<option value="">Nincs mentett mérkőzés</option>';
        return;
    }

    keys.reverse().forEach(matchId => {
        const option = document.createElement('option');
        option.value = matchId;
        const matchData = matchesObj[matchId];
        const t1 = matchData.ifi?.team1 || matchData.adult?.team1 || 'Hazai';
        const t2 = matchData.ifi?.team2 || matchData.adult?.team2 || 'Vendég';
        option.textContent = `${matchId} (${t1} vs ${t2})`;
        
        if (matchId === currentValue) {
            option.selected = true;
        }
        selectEl.appendChild(option);
    });
}

function filterMatches() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = {};

    Object.keys(allMatches).forEach(key => {
        const m = allMatches[key];
        const textToSearch = `${key} ${m.ifi?.team1 || ''} ${m.ifi?.team2 || ''} ${m.adult?.team1 || ''} ${m.adult?.team2 || ''}`.toLowerCase();
        if (textToSearch.includes(query)) {
            filtered[key] = m;
        }
    });

    populateSelectOptions(filtered);
    renderSelectedMatch();
}

function renderSelectedMatch() {
    const selectedId = document.getElementById('archiveSelect').value;
    const boardDisplay = document.getElementById('boardDisplay');
    const noMatchMsg = document.getElementById('noMatchMsg');

    if (!selectedId || !allMatches[selectedId]) {
        boardDisplay.classList.add('hidden');
        noMatchMsg.classList.remove('hidden');
        return;
    }

    const data = allMatches[selectedId];
    boardDisplay.classList.remove('hidden');
    noMatchMsg.classList.add('hidden'); // JAVÍTVA: classList.add használata

    if (data.ifi) {
        document.getElementById('ifiTitle').innerText = data.ifi.title || 'BAJNOKI MÉRKŐZÉS';
        document.getElementById('ifiTeam1').innerText = data.ifi.team1 || 'HAZAI';
        document.getElementById('ifiTeam2').innerText = data.ifi.team2 || 'VENDÉG';
        setupLogo('ifiLogo1', data.ifi.logo1);
        setupLogo('ifiLogo2', data.ifi.logo2);

        renderCategoryDisplay('ifi', data.ifi.pairs || [], 2);
    }

    if (data.adult) {
        document.getElementById('adultTitle').innerText = data.adult.title || 'BAJNOKI MÉRKŐZÉS';
        document.getElementById('adultTeam1').innerText = data.adult.team1 || 'HAZAI';
        document.getElementById('adultTeam2').innerText = data.adult.team2 || 'VENDÉG';
        setupLogo('adultLogo1', data.adult.logo1);
        setupLogo('adultLogo2', data.adult.logo2);

        renderCategoryDisplay('adult', data.adult.pairs || [], 6);
    }
}

function setupLogo(elementId, logoUrl) {
    const imgEl = document.getElementById(elementId);
    if (logoUrl) {
        imgEl.src = logoUrl;
        imgEl.style.display = 'inline-block';
    } else {
        imgEl.style.display = 'none';
    }
}

function getCompareClass(val1, val2) {
    const v1 = Number(val1) || 0;
    const v2 = Number(val2) || 0;
    
    if (v1 === 0 && v2 === 0) return '';
    if (v1 > v2) return 'res-win';
    if (v1 < v2) return 'res-loss';
    return 'res-draw';
}

function renderCategoryDisplay(prefix, pairs, count) {
    const p1Container = document.getElementById(`${prefix}P1Container`);
    const p2Container = document.getElementById(`${prefix}P2Container`);
    const summaryEl = document.getElementById(`${prefix}Summary`);

    p1Container.innerHTML = '';
    p2Container.innerHTML = '';

    let team1TotalPins = 0;
    let team2TotalPins = 0;
    let team1MatchPoints = 0;
    let team2MatchPoints = 0;

    for (let i = 0; i < count; i++) {
        const pair = pairs[i] || { p1Name: '', p2Name: '', p1Sets: [0,0,0,0], p2Sets: [0,0,0,0] };
        
        const p1Sets = pair.p1Sets || [0,0,0,0];
        const p2Sets = pair.p2Sets || [0,0,0,0];

        const p1Sum = p1Sets.reduce((a, b) => a + Number(b || 0), 0);
        const p2Sum = p2Sets.reduce((a, b) => a + Number(b || 0), 0);

        team1TotalPins += p1Sum;
        team2TotalPins += p2Sum;

        let p1SetPoints = 0;
        let p2SetPoints = 0;
        
        let p1SetsHtml = '';
        let p2SetsHtmlReversed = '';

        for (let s = 0; s < 4; s++) {
            const v1 = Number(p1Sets[s]) || 0;
            const v2 = Number(p2Sets[s]) || 0;

            if (v1 > v2) p1SetPoints += 1;
            else if (v1 < v2) p2SetPoints += 1;
            else if (v1 > 0) { p1SetPoints += 0.5; p2SetPoints += 0.5; }

            const clsP1 = getCompareClass(v1, v2);
            p1SetsHtml += `<div class="set-cell ${clsP1}">${v1}</div>`;
        }

        for (let s = 3; s >= 0; s--) {
            const v1 = Number(p1Sets[s]) || 0;
            const v2 = Number(p2Sets[s]) || 0;
            const clsP2 = getCompareClass(v2, v1);

            p2SetsHtmlReversed += `<div class="set-cell ${clsP2}">${v2}</div>`;
        }

        let p1Pts = 0, p2Pts = 0;
        if (p1SetPoints > p2SetPoints) { p1Pts = 1; }
        else if (p1SetPoints < p2SetPoints) { p2Pts = 1; }
        else if (p1Sum > p2Sum) { p1Pts = 1; }
        else if (p1Sum < p2Sum) { p2Pts = 1; }
        else if (p1Sum > 0) { p1Pts = 0.5; p2Pts = 0.5; }

        team1MatchPoints += p1Pts;
        team2MatchPoints += p2Pts;

        const totalClsP1 = getCompareClass(p1Sum, p2Sum);
        const totalClsP2 = getCompareClass(p2Sum, p1Sum);

        p1Container.innerHTML += `
            <div class="pair-row-p1">
                <span class="pair-num">${i+1}.</span>
                <span class="player-name">${pair.p1Name || '-'}</span>
                <div class="sets-box">${p1SetsHtml}</div>
                <div class="sp-cell">${p1SetPoints}</div>
                <div class="total-cell ${totalClsP1}">${p1Sum}</div>
                <div class="point-cell">${p1Pts}</div>
            </div>
        `;

        p2Container.innerHTML += `
            <div class="pair-row-p2">
                <span class="pair-num">${i+1}.</span>
                <span class="player-name">${pair.p2Name || '-'}</span>
                <div class="sets-box">${p2SetsHtmlReversed}</div>
                <div class="sp-cell">${p2SetPoints}</div>
                <div class="total-cell ${totalClsP2}">${p2Sum}</div>
                <div class="point-cell">${p2Pts}</div>
            </div>
        `;
    }

    if (team1TotalPins > team2TotalPins) team1MatchPoints += 2;
    else if (team1TotalPins < team2TotalPins) team2MatchPoints += 2;
    else if (team1TotalPins > 0) { team1MatchPoints += 1; team2MatchPoints += 1; }

    summaryEl.innerHTML = `
        <div class="sum-team-pins">Összfa: ${team1TotalPins}</div>
        <div class="sum-score-display">${team1MatchPoints} : ${team2MatchPoints}</div>
        <div class="sum-team-pins">Összfa: ${team2TotalPins}</div>
    `;
}
</script>
