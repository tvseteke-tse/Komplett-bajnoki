<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mérkőzés Archívum - Bajnoki Eredmények</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #00122e;
        color: #ffff00;
        padding: 12px;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }

    .container {
        max-width: 1000px;
        margin: 0 auto;
        background: #1e1e1e;
        border: 2px solid #333;
        border-radius: 12px;
        padding: 15px;
        color: white;
        box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    h1 {
        text-align: center;
        color: #ffff00;
        margin-bottom: 15px;
        font-size: 1.6rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* VÁLASZTÓ ÉS KERESŐ PANEL */
    .filter-panel {
        background: #141414;
        border: 1px solid #0044aa;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 20px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: space-between;
    }

    .filter-group {
        display: flex;
        gap: 8px;
        align-items: center;
        flex: 1;
        min-width: 250px;
    }

    .filter-group label {
        font-size: 0.9rem;
        color: #8b949e;
        white-space: nowrap;
    }

    select, input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        background: #252525;
        border: 1px solid #444;
        color: #00ff66;
        border-radius: 5px;
        font-size: 0.95rem;
        outline: none;
    }

    select:focus, input[type="text"]:focus {
        border-color: #00ff66;
    }

    /* MECCS ADATOK / FEJLÉC */
    .match-header {
        background: #111;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 20px;
        text-align: center;
    }

    .match-title {
        color: #ffff00;
        font-size: 1.2rem;
        font-weight: bold;
        margin-bottom: 8px;
        text-transform: uppercase;
    }

    .teams-display {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
    }

    .team-info {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1;
    }
    .team-info.left { justify-content: flex-start; }
    .team-info.right { justify-content: flex-end; }

    .team-logo {
        width: 40px;
        height: 40px;
        object-fit: contain;
        background: #222;
        border-radius: 4px;
        padding: 2px;
    }

    .team-name {
        font-size: 1.1rem;
        font-weight: bold;
        color: #fff;
    }

    .vs-badge {
        background: #0044aa;
        color: white;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: bold;
    }

    /* TABELÁK ÉS KÁRTYÁK */
    .section-title {
        color: #00ff66;
        font-size: 1.1rem;
        text-transform: uppercase;
        margin: 15px 0 8px 0;
        border-bottom: 1px solid #00ff66;
        padding-bottom: 4px;
    }

    .score-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
        font-size: 0.9rem;
    }

    .score-table th, .score-table td {
        border: 1px solid #333;
        padding: 6px 8px;
        text-align: center;
    }

    .score-table th {
        background: #252525;
        color: #ffff00;
        font-weight: 600;
    }

    .score-table td.player-name {
        text-align: left;
        color: #fff;
        width: 25%;
    }

    .score-table td.set-val {
        color: #aaa;
        width: 6%;
    }

    .score-table td.total-val {
        font-weight: bold;
        color: #00ff66;
        width: 10%;
        background: #181818;
    }

    .score-table td.point-val {
        font-weight: bold;
        color: #ffff00;
        width: 8%;
        background: #222;
    }

    .totals-row {
        background: #151515;
        font-weight: bold;
    }

    .totals-row td {
        color: #00ff66 !important;
    }

    .empty-msg {
        text-align: center;
        padding: 40px;
        color: #8b949e;
        font-size: 1.1rem;
    }

    @media (max-width: 600px) {
        .teams-display { flex-direction: column; text-align: center; }
        .team-info.left, .team-info.right { justify-content: center; }
        .score-table { font-size: 0.75rem; }
        .score-table th, .score-table td { padding: 4px 2px; }
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h1>📚 Mérkőzés Archívum</h1>

    <!-- KERESŐ ÉS VÁLASZTÓ SÁV -->
    <div class="filter-panel">
        <div class="filter-group">
            <label for="archiveSelect">Mérkőzés:</label>
            <select id="archiveSelect" onchange="displaySelectedMatch()">
                <option value="">-- Töltés... --</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="searchInput">Keresés:</label>
            <input type="text" id="searchInput" placeholder="Szűrés névre, csapatra..." oninput="filterMatches()">
        </div>
    </div>

    <!-- MECCSEK MEGJELENÍTÉSE -->
    <div id="matchDisplay" class="hidden">
        <div class="match-header">
            <div id="matchTitle" class="match-title">-</div>
            <div class="teams-display">
                <div class="team-info left">
                    <img id="logo1" class="team-logo" src="" alt="" onerror="this.style.display='none'">
                    <span id="team1" class="team-name">Hazai</span>
                </div>
                <div class="vs-badge">VS</div>
                <div class="team-info right">
                    <span id="team2" class="team-name">Vendég</span>
                    <img id="logo2" class="team-logo" src="" alt="" onerror="this.style.display='none'">
                </div>
            </div>
        </div>

        <!-- IFJÚSÁGI MÉRKŐZÉS -->
        <div class="section-title">Ifjúsági Mérkőzés (2 fős)</div>
        <div id="ifiTableContainer"></div>

        <!-- FELNŐTT MÉRKŐZÉS -->
        <div class="section-title" style="color: #ffff00; border-color: #ffff00;">Felnőtt Mérkőzés (6 fős)</div>
        <div id="adultTableContainer"></div>
    </div>

    <div id="noMatchMsg" class="empty-msg">
        Válassz ki egy mérkőzést a fenti listából a megtekintéshez!
    </div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

let allMatches = {};

// Archív meccsek betöltése adatbázisból
db.ref('matches').once('value').then((snapshot) => {
    allMatches = snapshot.val() || {};
    populateSelectOptions(allMatches);
}).catch(err => {
    console.error("Hiba az adatok lekérésekor:", err);
    document.getElementById('archiveSelect').innerHTML = '<option value="">Hiba a betöltéskor!</option>';
});

function populateSelectOptions(matchesObj) {
    const selectEl = document.getElementById('archiveSelect');
    selectEl.innerHTML = '<option value="">-- Válassz mérkőzést --</option>';

    const keys = Object.keys(matchesObj);
    if (keys.length === 0) {
        selectEl.innerHTML = '<option value="">Nincs mentett mérkőzés</option>';
        return;
    }

    keys.reverse().forEach(matchId => {
        const option = document.createElement('option');
        option.value = matchId;
        const matchData = matchesObj[matchId];
        const t1 = matchData.ifi?.team1 || 'Hazai';
        const t2 = matchData.ifi?.team2 || 'Vendég';
        option.textContent = `${matchId} (${t1} - ${t2})`;
        selectEl.appendChild(option);
    });
}

function filterMatches() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = {};

    Object.keys(allMatches).forEach(key => {
        const m = allMatches[key];
        const textToSearch = `${key} ${m.ifi?.team1} ${m.ifi?.team2} ${m.ifi?.title}`.toLowerCase();
        if (textToSearch.includes(query)) {
            filtered[key] = m;
        }
    });

    populateSelectOptions(filtered);
}

function displaySelectedMatch() {
    const selectedId = document.getElementById('archiveSelect').value;
    const displayArea = document.getElementById('matchDisplay');
    const noMsg = document.getElementById('noMatchMsg');

    if (!selectedId || !allMatches[selectedId]) {
        displayArea.classList.add('hidden');
        noMsg.classList.remove('hidden');
        return;
    }

    const data = allMatches[selectedId];
    displayArea.classList.remove('hidden');
    noMsg.classList.add('hidden');

    // Fejléc beállítása
    document.getElementById('matchTitle').innerText = data.ifi?.title || data.adult?.title || 'BAJNOKI MÉRKŐZÉS';
    document.getElementById('team1').innerText = data.ifi?.team1 || 'Hazai';
    document.getElementById('team2').innerText = data.ifi?.team2 || 'Vendég';

    const logo1El = document.getElementById('logo1');
    const logo2El = document.getElementById('logo2');

    if (data.ifi?.logo1) { logo1El.src = data.ifi.logo1; logo1El.style.display = 'inline-block'; }
    else { logo1El.style.display = 'none'; }

    if (data.ifi?.logo2) { logo2El.src = data.ifi.logo2; logo2El.style.display = 'inline-block'; }
    else { logo2El.style.display = 'none'; }

    // Táblázatok generálása
    renderCategoryTable('ifiTableContainer', data.ifi?.pairs || []);
    renderCategoryTable('adultTableContainer', data.adult?.pairs || []);
}

function renderCategoryTable(containerId, pairs) {
    const container = document.getElementById(containerId);
    if (!pairs || pairs.length === 0) {
        container.innerHTML = '<div style="color:#666; font-style:italic; padding:8px;">Nincsenek adatok.</div>';
        return;
    }

    let team1TotalPins = 0;
    let team2TotalPins = 0;
    let team1MatchPoints = 0;
    let team2MatchPoints = 0;

    let rowsHtml = '';

    pairs.forEach((pair, idx) => {
        const p1Sets = pair.p1Sets || [0,0,0,0];
        const p2Sets = pair.p2Sets || [0,0,0,0];

        const p1Sum = p1Sets.reduce((a, b) => a + Number(b), 0);
        const p2Sum = p2Sets.reduce((a, b) => a + Number(b), 0);

        team1TotalPins += p1Sum;
        team2TotalPins += p2Sum;

        // Szettpontok kiszámítása
        let p1SetPoints = 0;
        let p2SetPoints = 0;
        for (let s = 0; s < 4; s++) {
            if ((p1Sets[s] || 0) > (p2Sets[s] || 0)) p1SetPoints += 1;
            else if ((p1Sets[s] || 0) < (p2Sets[s] || 0)) p2SetPoints += 1;
            else if ((p1Sets[s] || 0) > 0) { p1SetPoints += 0.5; p2SetPoints += 0.5; }
        }

        // Egyéni meccspont eldöntése
        let p1Pts = 0, p2Pts = 0;
        if (p1SetPoints > p2SetPoints) { p1Pts = 1; }
        else if (p1SetPoints < p2SetPoints) { p2Pts = 1; }
        else if (p1Sum > p2Sum) { p1Pts = 1; }
        else if (p1Sum < p2Sum) { p2Pts = 1; }
        else if (p1Sum > 0) { p1Pts = 0.5; p2Pts = 0.5; }

        team1MatchPoints += p1Pts;
        team2MatchPoints += p2Pts;

        rowsHtml += `
            <tr>
                <td class="player-name">${pair.p1Name || '-'}</td>
                ${p1Sets.map(s => `<td class="set-val">${s || 0}</td>`).join('')}
                <td class="total-val">${p1Sum}</td>
                <td class="point-val">${p1Pts}</td>
                <td style="background:#000; width:2px; padding:0;"></td>
                <td class="player-name" style="text-align:right;">${pair.p2Name || '-'}</td>
                ${p2Sets.map(s => `<td class="set-val">${s || 0}</td>`).join('')}
                <td class="total-val">${p2Sum}</td>
                <td class="point-val">${p2Pts}</td>
            </tr>
        `;
    });

    // Bónusz csapatpontok (Összfa alapján)
    if (team1TotalPins > team2TotalPins) team1MatchPoints += 2;
    else if (team1TotalPins < team2TotalPins) team2MatchPoints += 2;
    else if (team1TotalPins > 0) { team1MatchPoints += 1; team2MatchPoints += 1; }

    const tableHtml = `
        <table class="score-table">
            <thead>
                <tr>
                    <th>Hazai Játékos</th>
                    <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                    <th>Össz</th>
                    <th>P</th>
                    <th style="background:#000; width:2px;"></th>
                    <th>Vendég Játékos</th>
                    <th>S1</th><th>S2</th><th>S3</th><th>S4</th>
                    <th>Össz</th>
                    <th>P</th>
                </tr>
            </thead>
            <tbody>
                ${rowsHtml}
                <tr class="totals-row">
                    <td colspan="5" style="text-align:right;">ÖSSZESEN:</td>
                    <td class="total-val">${team1TotalPins}</td>
                    <td class="point-val">${team1MatchPoints}</td>
                    <td style="background:#000;"></td>
                    <td colspan="5" style="text-align:right;">ÖSSZESEN:</td>
                    <td class="total-val">${team2TotalPins}</td>
                    <td class="point-val">${team2MatchPoints}</td>
                </tr>
            </tbody>
        </table>
    `;

    container.innerHTML = tableHtml;
}
</script>
</body>
</html>
