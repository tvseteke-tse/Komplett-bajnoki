<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komplett Bajnoki Admin</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        background-color: #00122e;
        color: #ffff00;
        padding: 8px;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }

    /* SEGÉDOSZTÁLY REJTÉSHEZ */
    .hidden { display: none !important; }

    /* BEJELENTKEZŐ ABLAK STÍLUSAI */
    #auth-container {
        max-width: 360px;
        margin: 60px auto;
        background: #1e1e1e;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 20px;
        color: white;
        text-align: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #auth-container h2 {
        color: #ffff00;
        margin-bottom: 15px;
        font-size: 1.3rem;
        text-transform: uppercase;
    }
    #auth-container input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        background: #1a1a1a;
        border: 1px solid #444;
        color: white;
        border-radius: 5px;
        font-size: 1rem;
    }
    #auth-container button {
        width: 100%;
        padding: 10px;
        margin-top: 12px;
        background: #00ff66;
        color: #000;
        border: none;
        border-radius: 5px;
        font-weight: bold;
        font-size: 1rem;
        cursor: pointer;
    }
    #auth-container button:hover {
        background: #00cc52;
    }
    #auth-error {
        color: #ff4d4d;
        margin-top: 10px;
        font-size: 0.9rem;
    }

    /* ADMIN CONTAINER */
    .admin-container {
        max-width: 100%;
        margin: 0 auto;
        background: #1e1e1e;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 10px 14px;
        color: white;
    }
    .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        padding-bottom: 6px;
        border-bottom: 1px solid #333;
    }
    .logout-btn {
        background: #ff3b30;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 5px;
        font-weight: bold;
        cursor: pointer;
    }
    .logout-btn:hover {
        background: #d63027;
    }

    .section-title {
        text-align: center;
        color: #ffff00;
        margin-bottom: 6px;
        font-size: 1.25rem; 
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    /* MECCS FEJLÉCEK */
    .match-header-grid {
        display: grid;
        grid-template-columns: 1fr 220px 1fr;
        gap: 12px;
        align-items: center;
        margin-bottom: 8px;
    }
    .team-box {
        display: flex;
        gap: 8px;
    }
    .team-box input.team-name {
        flex: 1.2;
        background: #2a2a2a; 
        border: 1px solid #444; 
        color: #ffff00;
        padding: 6px 10px; 
        font-size: 1.1rem; 
        border-radius: 5px; 
        text-align: center; 
        font-weight: bold;
    }
    .team-box input.logo-url {
        flex: 1;
        background: #222; 
        border: 1px solid #444; 
        color: #00ff66;
        padding: 6px 10px; 
        font-size: 0.85rem; 
        border-radius: 5px; 
        text-align: center;
    }

    /* BAL-JOBB OSZLOPOS PÁROSOK */
    .pairs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }
    .pair-row {
        display: flex;
        gap: 6px;
        align-items: center;
        background: #252525;
        border: 1px solid #333;
        border-radius: 6px;
        padding: 4px 8px;
        margin-bottom: 4px;
    }
    .pair-num {
        font-weight: bold;
        color: #8b949e;
        font-size: 0.95rem;
        width: 20px;
        text-align: center;
    }
    .pair-row input[type="text"] {
        width: 200px; 
        min-width: 200px;
        background: #1a1a1a;
        border: 1px solid #444;
        color: white;
        padding: 5px 8px;
        border-radius: 5px;
        font-size: 0.95rem;
    }
    .sets-inputs {
        display: flex;
        gap: 4px;
        flex: 1;
    }
    .sets-inputs input[type="number"] {
        flex: 1;
        width: 90px;
        min-width: 0; 
        height: 30px; 
        background: #1a1a1a;
        border: 1px solid #444;
        color: #00ff66;
        text-align: center;
        padding: 2px 0;
        font-weight: bold;
        border-radius: 5px;
        font-size: 1.05rem;
    }

    .section-divider {
        height: 3px;
        background: linear-gradient(90deg, #0044aa, #00ff66, #0044aa);
        border-radius: 2px;
        margin: 8px 0;
    }
</style>

<!-- Firebase SDK modulok COMPAT verzióban -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>

<!-- 1. BEJELENTKEZŐ ABLAK (Alapértelmezetten ez látszik) -->
<div id="auth-container">
    <h2>Admin Bejelentkezés</h2>
    <input type="email" id="auth-email" placeholder="E-mail cím" autocomplete="email">
    <input type="password" id="auth-password" placeholder="Jelszó" autocomplete="current-password">
    <button id="auth-login-btn">Bejelentkezés</button>
    <div id="auth-error"></div>
</div>

<!-- 2. ADMIN CONTAINER (Bejelentkezésig rejtve) -->
<div id="admin-content" class="admin-container hidden">
    
    <div class="top-bar">
        <span style="font-size: 0.85rem; color: #8b949e;">Munkamenet: Bejelentkezve</span>
        <button id="auth-logout-btn" class="logout-btn">Kijelentkezés</button>
    </div>

    <!-- IFI MECCS SECTION -->
    <div class="section-title">Ifjúsági Bajnoki Mérkőzés (2 fős)</div>
    
    <div class="match-header-grid">
        <div class="team-box">
            <input type="text" id="team1Ifi" class="team-name" placeholder="Hazai Ifi Csapat" value="Hazai Ifi" oninput="sendAdminData()">
            <input type="text" id="logo1Ifi" class="logo-url" placeholder="Hazai Logó URL" value="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png" oninput="sendAdminData()">
        </div>
        <div>
            <input type="text" id="titleIfi" value="IFI BAJNOKI MÉRKŐZÉS" placeholder="Megnevezés" oninput="sendAdminData()" style="width: 100%; background: #2a2a2a; border: 1px solid #444; color: #ffff00; padding: 6px; text-align: center; font-size: 0.95rem; border-radius: 5px; font-weight: bold;">
        </div>
        <div class="team-box">
            <input type="text" id="logo2Ifi" class="logo-url" placeholder="Vendég Logó URL" oninput="sendAdminData()">
            <input type="text" id="team2Ifi" class="team-name" placeholder="Vendég Ifi Csapat" value="Vendég Ifi" oninput="sendAdminData()">
        </div>
    </div>

    <div class="pairs-grid">
        <div id="adminIfiPairsP1"></div>
        <div id="adminIfiPairsP2"></div>
    </div>

    <!-- ELVÁLASZTÓ CSÍK -->
    <div class="section-divider"></div>

    <!-- FELNŐTT MECCS SECTION -->
    <div class="section-title" style="color: #3fb950;">Felnőtt Bajnoki Mérkőzés (6 fős)</div>
    
    <div class="match-header-grid">
        <div class="team-box">
            <input type="text" id="team1Adult" class="team-name" placeholder="Hazai Csapat" value="Hazai" oninput="sendAdminData()" style="width: 100%;">
        </div>
        <div>
            <input type="text" id="titleAdult" value="FELNŐTT BAJNOKI MÉRKŐZÉS" placeholder="Megnevezés" oninput="sendAdminData()" style="width: 100%; background: #2a2a2a; border: 1px solid #444; color: #ffff00; padding: 6px; text-align: center; font-size: 0.95rem; border-radius: 5px; font-weight: bold;">
        </div>
        <div class="team-box">
            <input type="text" id="team2Adult" class="team-name" placeholder="Vendég Csapat" value="Vendég" oninput="sendAdminData()" style="width: 100%;">
        </div>
    </div>

    <div class="pairs-grid">
        <div id="adminAdultPairsP1"></div>
        <div id="adminAdultPairsP2"></div>
    </div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyD8o7xyCtxTJlQcM8z-29XTBOpBXrYbjOM",,
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
const auth = firebase.auth();

// DOM ELEMEK
const authContainer = document.getElementById('auth-container');
const adminContent = document.getElementById('admin-content');
const emailInput = document.getElementById('auth-email');
const passwordInput = document.getElementById('auth-password');
const loginBtn = document.getElementById('auth-login-btn');
const logoutBtn = document.getElementById('auth-logout-btn');
const errorDiv = document.getElementById('auth-error');

// BEJELENTKEZÉSI ÁLLAPOT FIGYELÉSE
auth.onAuthStateChanged((user) => {
    if (user) {
        authContainer.classList.add('hidden');
        adminContent.classList.remove('hidden');
        loadDatabaseData(); // Adatok betöltése belépés után
    } else {
        authContainer.classList.remove('hidden');
        adminContent.classList.add('hidden');
    }
});

// BEJELENTKEZÉS
loginBtn.addEventListener('click', (e) => {
    e.preventDefault(); // Megakadályozza az esetleges alapértelmezett űrlap-elküldést
    
    const email = emailInput.value.trim().toLowerCase();
    const password = passwordInput.value;
    
    errorDiv.style.color = '#ffff00';
    errorDiv.innerText = 'Bejelentkezés folyamatban...';

    if (!email || !password) {
        errorDiv.style.color = '#ff4d4d';
        errorDiv.innerText = 'Kérjük, töltsd ki mindkét mezőt!';
        return;
    }

    auth.signInWithEmailAndPassword(email, password)
        .then((userCredential) => {
            // Sikeres belépéskor kényszerítjük a nézetváltást
            errorDiv.innerText = '';
            authContainer.classList.add('hidden');
            adminContent.classList.remove('hidden');
            loadDatabaseData();
        })
        .catch((error) => {
            console.error("Auth hiba:", error);
            errorDiv.style.color = '#ff4d4d';
            errorDiv.innerText = `Hiba (${error.code}): Hibás e-mail vagy jelszó!`;
        });
});

// KIJELENTKEZÉS
logoutBtn.addEventListener('click', () => {
    auth.signOut();
});

// PÁROK GENERÁLÁSA
function generatePairInputsSideBySide(prefix, count) {
    const p1Container = document.getElementById(`admin${prefix.charAt(0).toUpperCase() + prefix.slice(1)}PairsP1`);
    const p2Container = document.getElementById(`admin${prefix.charAt(0).toUpperCase() + prefix.slice(1)}PairsP2`);
    
    p1Container.innerHTML = '';
    p2Container.innerHTML = '';

    for (let i = 0; i < count; i++) {
        p1Container.innerHTML += `
            <div class="pair-row" data-pair="${i}">
                <span class="pair-num">${i+1}.</span>
                <input type="text" class="p1-name" placeholder="Hazai Játékos ${i+1}" oninput="sendAdminData()">
                <div class="sets-inputs">
                    ${[0,1,2,3].map(s => `<input type="number" class="p1-s${s}" placeholder="S${s+1}" oninput="sendAdminData()">`).join('')}
                </div>
            </div>
        `;
        p2Container.innerHTML += `
            <div class="pair-row" data-pair="${i}">
                <span class="pair-num">${i+1}.</span>
                <input type="text" class="p2-name" placeholder="Vendég Játékos ${i+1}" oninput="sendAdminData()">
                <div class="sets-inputs">
                    ${[0,1,2,3].map(s => `<input type="number" class="p2-s${s}" placeholder="S${s+1}" oninput="sendAdminData()">`).join('')}
                </div>
            </div>
        `;
    }
}

function extractPairsData(prefix, count) {
    const pairs = [];
    const p1Container = document.getElementById(`admin${prefix.charAt(0).toUpperCase() + prefix.slice(1)}PairsP1`);
    const p2Container = document.getElementById(`admin${prefix.charAt(0).toUpperCase() + prefix.slice(1)}PairsP2`);
    
    const p1Rows = p1Container.querySelectorAll('.pair-row');
    const p2Rows = p2Container.querySelectorAll('.pair-row');

    for (let i = 0; i < count; i++) {
        pairs.push({
            p1Name: p1Rows[i].querySelector('.p1-name').value,
            p2Name: p2Rows[i].querySelector('.p2-name').value,
            p1Sets: [0,1,2,3].map(s => parseInt(p1Rows[i].querySelector(`.p1-s${s}`).value) || 0),
            p2Sets: [0,1,2,3].map(s => parseInt(p2Rows[i].querySelector(`.p2-s${s}`).value) || 0)
        });
    }
    return pairs;
}

// KÜLDÉS AZ ADATBÁZISBA (Csak akkor engedi a Firebase, ha be van jelentkezve)
function sendAdminData() {
    if (!auth.currentUser) return;

    const sharedLogo1 = document.getElementById('logo1Ifi').value;
    const sharedLogo2 = document.getElementById('logo2Ifi').value;

    const data = {
        ifi: {
            title: document.getElementById('titleIfi').value,
            team1: document.getElementById('team1Ifi').value,
            team2: document.getElementById('team2Ifi').value,
            logo1: sharedLogo1,
            logo2: sharedLogo2,
            pairs: extractPairsData('ifi', 2)
        },
        adult: {
            title: document.getElementById('titleAdult').value,
            team1: document.getElementById('team1Adult').value,
            team2: document.getElementById('team2Adult').value,
            logo1: sharedLogo1,
            logo2: sharedLogo2,
            pairs: extractPairsData('adult', 6)
        }
    };

    db.ref('osszevont_bajnoki_bowling').set(data);
}

// INICIALIZÁLÁS
generatePairInputsSideBySide('ifi', 2);
generatePairInputsSideBySide('adult', 6);

function loadDatabaseData() {
    db.ref('osszevont_bajnoki_bowling').once('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            if (data.ifi) {
                document.getElementById('titleIfi').value = data.ifi.title || '';
                document.getElementById('team1Ifi').value = data.ifi.team1 || '';
                document.getElementById('team2Ifi').value = data.ifi.team2 || '';
                document.getElementById('logo1Ifi').value = data.ifi.logo1 || 'https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png';
                document.getElementById('logo2Ifi').value = data.ifi.logo2 || '';
                populatePairs('ifi', data.ifi.pairs);
            }
            if (data.adult) {
                document.getElementById('titleAdult').value = data.adult.title || '';
                document.getElementById('team1Adult').value = data.adult.team1 || '';
                document.getElementById('team2Adult').value = data.adult.team2 || '';
                populatePairs('adult', data.adult.pairs);
            }
        }
    });
}

function populatePairs(prefix, pairsData) {
    if (!pairsData || !Array.isArray(pairsData)) return;
    const p1Rows = document.querySelectorAll(`#admin${prefix.charAt(0).toUpperCase() + prefix.slice(1)}PairsP1 .pair-row`);
    const p2Rows = document.querySelectorAll(`#admin${prefix.charAt(0).toUpperCase() + prefix.slice(1)}PairsP2 .pair-row`);
    
    pairsData.forEach((row, idx) => {
        if (p1Rows[idx] && p2Rows[idx]) {
            p1Rows[idx].querySelector('.p1-name').value = row.p1Name || '';
            p2Rows[idx].querySelector('.p2-name').value = row.p2Name || '';
            row.p1Sets.forEach((val, sIdx) => { p1Rows[idx].querySelector(`.p1-s${sIdx}`).value = val || ''; });
            row.p2Sets.forEach((val, sIdx) => { p2Rows[idx].querySelector(`.p2-s${sIdx}`).value = val || ''; });
        }
    });
}
</script>
</body>
</html>
