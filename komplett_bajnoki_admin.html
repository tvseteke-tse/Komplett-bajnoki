<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komplett Bajnoki Admin</title>
<style>
    * { box-sizing: border-box; }
    body {
        background-color: #00122e;
        color: #ffff00;
        margin: 0;
        padding: 10px;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
        height: 100vh;
        overflow: hidden; /* Belefér a 1080p magasságba görgetés nélkül */
    }
    .admin-container {
        max-width: 1200px;
        margin: 0 auto;
        background: #1e1e1e;
        border: 2px solid #333;
        border-radius: 8px;
        padding: 12px;
        color: white;
    }
    .section-title {
        text-align: center;
        color: #ffff00;
        margin: 0 0 8px 0;
        font-size: 1.1rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    
    /* MECCS FEJLÉCEK */
    .match-header-grid {
        display: grid;
        grid-template-columns: 1fr 200px 1fr;
        gap: 10px;
        align-items: center;
        margin-bottom: 8px;
    }
    .team-box {
        display: flex;
        gap: 6px;
    }
    .team-box input.team-name {
        flex: 1.2;
        background: #2a2a2a; 
        border: 1px solid #444; 
        color: #ffff00;
        padding: 6px; 
        font-size: 0.95rem; 
        border-radius: 4px; 
        text-align: center; 
        font-weight: bold;
    }
    .team-box input.logo-url {
        flex: 1;
        background: #222; 
        border: 1px solid #444; 
        color: #00ff66;
        padding: 6px; 
        font-size: 0.8rem; 
        border-radius: 4px; 
        text-align: center;
    }

    /* BAL-JOBB OSZLOPOS PÁROSOK */
    .pairs-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
    }
    .pair-row {
        display: flex;
        gap: 6px;
        align-items: center;
        background: #252525;
        border: 1px solid #333;
        border-radius: 4px;
        padding: 4px 8px;
        margin-bottom: 4px;
    }
    .pair-num {
        font-weight: bold;
        color: #8b949e;
        font-size: 0.8rem;
        width: 20px;
        text-align: center;
    }
    .pair-row input[type="text"] {
        flex: 1;
        background: #1a1a1a;
        border: 1px solid #444;
        color: white;
        padding: 4px 6px;
        border-radius: 4px;
        font-size: 0.85rem;
    }
    .sets-inputs {
        display: flex;
        gap: 3px;
    }
    .sets-inputs input[type="number"] {
        width: 34px;
        background: #1a1a1a;
        border: 1px solid #444;
        color: #00ff66;
        text-align: center;
        padding: 4px 2px;
        font-weight: bold;
        border-radius: 4px;
        font-size: 0.85rem;
    }

    .section-divider {
        height: 3px;
        background: linear-gradient(90deg, #0044aa, #00ff66, #0044aa);
        border-radius: 2px;
        margin: 10px 0;
        box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="admin-container">
    
    <div class="section-title">Ifjúsági Bajnoki Mérkőzés (2 fős)</div>
    
    <div class="match-header-grid">
        <div class="team-box">
            <input type="text" id="team1Ifi" class="team-name" placeholder="Hazai Ifi Csapat" value="Hazai Ifi" oninput="sendAdminData()">
            <input type="text" id="logo1Ifi" class="logo-url" placeholder="Hazai Logó URL" value="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png" oninput="sendAdminData()">
        </div>
        <div>
            <input type="text" id="titleIfi" value="IFI BAJNOKI MÉRKŐZÉS" placeholder="Megnevezés" oninput="sendAdminData()" style="width: 100%; background: #2a2a2a; border: 1px solid #444; color: #ffff00; padding: 6px; text-align: center; font-size: 0.85rem; border-radius: 4px; font-weight: bold;">
        </div>
        <div class="team-box">
            <input type="text" id="logo2Ifi" class="logo-url" placeholder="Vendég Logó URL" oninput="sendAdminData()">
            <input type="text" id="team2Ifi" class="team-name" placeholder="Vendég Ifi Csapat"
