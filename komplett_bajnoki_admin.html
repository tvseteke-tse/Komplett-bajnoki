<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komplett Bajnoki Admin</title>
<style>
    body {
        background-color: #00122e;
        color: #ffff00;
        margin: 0;
        padding: 20px;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }
    .admin-container {
        max-width: 950px;
        margin: 0 auto;
        background: #1e1e1e;
        border: 2px solid #333;
        border-radius: 10px;
        padding: 20px;
        color: white;
    }
    .section-title {
        text-align: center;
        color: #ffff00;
        margin-top: 10px;
        margin-bottom: 15px;
        font-size: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .admin-header-inputs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-bottom: 20px;
    }
    .admin-header-inputs input {
        background: #2a2a2a; border: 1px solid #444; color: #ffff00;
        padding: 10px; font-size: 1.1rem; border-radius: 5px; text-align: center; font-weight: bold;
    }
    .pair-card {
        background: #252525;
        border: 1px solid #333;
        border-radius: 8px;
        padding: 12px 15px;
        margin-bottom: 12px;
    }
    .pair-title { font-weight: bold; color: #8b949e; margin-bottom: 8px; font-size: 0.95rem; }
    .player-row { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
    .player-row input[type="text"] { flex: 1; background: #1a1a1a; border: 1px solid #444; color: white; padding: 8px; border-radius: 4px; }
    .sets-inputs { display: flex; gap: 6px; }
    .sets-inputs input[type="number"] { width: 45px; background: #1a1a1a; border: 1px solid #444; color: #00ff66; text-align: center; padding: 6px; font-weight: bold; border-radius: 4px; }

    /* HATÁROZOTT ELVÁLASZTÓ CSÍK */
    .section-divider {
        height: 6px;
        background: linear-gradient(90deg, #0044aa, #00ff66, #0044aa);
        border-radius: 3px;
        margin: 35px 0;
        box-shadow: 0 0 12px rgba(0, 255, 102, 0.6);
    }
</style>

<!-- Firebase SDK-k -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="admin-container">
    
    <!-- IFI MECCS SECTION (ELŐL) -->
    <div class="section-title">Ifjúsági Bajnoki Mérkőzés (2 fős)</div>
    <div style="text-align: center; margin-bottom: 15px;">
        <input type="text" id="titleIfi" value="IFI BAJNOKI MÉRKŐZÉS" placeholder="Ifi Mérkőzés Megnevezése" oninput="sendAdminData()" style="width: 80%; background: #2a2a2a; border: 1px solid #444; color: #ffff00; padding: 8px; text-align: center; font-size: 1.1rem; border-radius: 5px; font-weight: bold;">
    </div>
    <div class="admin-header-inputs">
        <input type="text" id="team1Ifi" placeholder="Hazai Ifi Csapat" value="Hazai Ifi" oninput="sendAdminData()">
        <input type="text" id="team2Ifi" placeholder="Vendég Ifi Csapat" value="Vendég Ifi" oninput="sendAdminData()">
    </div>
    <div id="adminIfiPairs"></div>

    <!-- HATÁROZOTT ELVÁLASZTÓ CSÍK -->
    <div class="section-divider"></div>

    <!-- FELNŐTT MECCS SECTION -->
    <div class="section-title" style="color: #3fb950;">Felnőtt Bajnoki Mérkőzés (6 fős)</div>
    <div style="text-align: center; margin-bottom: 15px;">
        <input type="text" id="titleAdult" value="FELNŐTT BAJNOKI MÉRKŐZÉS" placeholder="Felnőtt Mérkőzés Megnevezése" oninput="sendAdminData()" style="width: 80%; background: #2a2a2a; border: 1px solid #444; color: #ffff00; padding: 8px; text-align: center; font-size: 1.1rem; border-radius: 5px; font-weight: bold;">
    </div>
    <div class="admin-header-inputs">
        <input type="text" id="team1Adult" placeholder="Hazai Csapat" value="Hazai" oninput="sendAdminData()">
        <input type="text" id="team2Adult" placeholder="Vendég Csapat" value="Vendég" oninput="sendAdminData()">
    </div>
    <div id="adminAdultPairs"></div>

</div>

<script>
const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

function generatePairInputs(containerId, count, prefix) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    for (let i = 0; i < count; i++) {
        container.innerHTML += `
            <div class="pair-card" data-prefix="${prefix}">
                <div class="pair-title">${i + 1}. PÁROS</div>
                <div class="player-row">
                    <input type="text" class="p1-name" placeholder="Hazai Játékos ${i+1}" oninput="sendAdminData()">
                    <div class="sets-inputs">
                        ${[0,1,2,3].map(s => `<input type="number" class="p1-s${s}" placeholder="S${s+1}" oninput="sendAdminData()">`).join('')}
                    </div>
                </div>
                <div class="player-row">
                    <input type="text" class="p2-name" placeholder="Vendég Játékos ${i+1}" oninput="sendAdminData()">
                    <div class="sets-inputs">
                        ${[0,1,2,3].map(s => `<input type="number" class="p2-s${s}" placeholder="S${s+1}" oninput="sendAdminData()">`).join('')}
                    </div>
                </div>
            </div>
        `;
    }
}

function extractPairsData(containerId) {
    const pairs = [];
    document.querySelectorAll(`#${containerId} .pair-card`).forEach(card => {
        pairs.push({
            p1Name: card.querySelector('.p1-name').value,
            p2Name: card.querySelector('.p2-name').value,
            p1Sets: [0,1,2,3].map(s => parseInt(card.querySelector(`.p1-s${s}`).value) || 0),
            p2Sets: [0,1,2,3].map(s => parseInt(card.querySelector(`.p2-s${s}`).value) || 0)
        });
    });
    return pairs;
}

function sendAdminData() {
    const data = {
        ifi: {
            title: document.getElementById('titleIfi').value,
            team1: document.getElementById('team1Ifi').value,
            team2: document.getElementById('team2Ifi').value,
            pairs: extractPairsData('adminIfiPairs')
        },
        adult: {
            title: document.getElementById('titleAdult').value,
            team1: document.getElementById('team1Adult').value,
            team2: document.getElementById('team2Adult').value,
            pairs: extractPairsData('adminAdultPairs')
        }
    };

    db.ref('osszevont_bajnoki_bowling').set(data);
}

// Inicializálás: Ifi elől (2 fős), Felnőtt alul (6 fős)
generatePairInputs('adminIfiPairs', 2, 'ifi');
generatePairInputs('adminAdultPairs', 6, 'adult');

// Adatok betöltése
db.ref('osszevont_bajnoki_bowling').once('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.ifi) {
            document.getElementById('titleIfi').value = data.ifi.title || '';
            document.getElementById('team1Ifi').value = data.ifi.team1 || '';
            document.getElementById('team2Ifi').value = data.ifi.team2 || '';
            populatePairs('adminIfiPairs', data.ifi.pairs);
        }
        if (data.adult) {
            document.getElementById('titleAdult').value = data.adult.title || '';
            document.getElementById('team1Adult').value = data.adult.team1 || '';
            document.getElementById('team2Adult').value = data.adult.team2 || '';
            populatePairs('adminAdultPairs', data.adult.pairs);
        }
    }
});

function populatePairs(containerId, pairsData) {
    if (!pairsData || !Array.isArray(pairsData)) return;
    const cards = document.querySelectorAll(`#${containerId} .pair-card`);
    pairsData.forEach((row, idx) => {
        if (cards[idx]) {
            cards[idx].querySelector('.p1-name').value = row.p1Name || '';
            cards[idx].querySelector('.p2-name').value = row.p2Name || '';
            row.p1Sets.forEach((val, sIdx) => { cards[idx].querySelector(`.p1-s${sIdx}`).value = val || ''; });
            row.p2Sets.forEach((val, sIdx) => { cards[idx].querySelector(`.p2-s${sIdx}`).value = val || ''; });
        }
    });
}
</script>
</body>
</html>
