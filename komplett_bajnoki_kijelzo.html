<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>Komplett Bajnoki Kijelző (1080p)</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000c1f;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }
    .main-board {
        width: 100%;
        height: 100vh;
        padding: 12px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
    }
    .match-block {
        background-color: #001c47;
        border: 2px solid #0044aa;
        border-radius: 10px;
        padding: 10px 20px;
        box-shadow: 0 0 20px rgba(0, 50, 150, 0.4);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    
    #blockIfi { flex: 0 0 32%; }
    #blockAdult { flex: 0 0 64%; }

    /* FORDULÓ / BAJNOKSÁG FEJLÉC */
    .header-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
        gap: 2px;
    }

    .matesz-logo {
        height: 100%;
        max-height: 80px; /* Kitölti a keret és a név közötti helyet */
        width: auto;
        object-fit: contain;
        filter: drop-shadow(0 0 8px rgba(0, 255, 102, 0.5));
    }

    .tournament-header {
        text-align: center;
        font-size: 2.2rem;
        color: #00ff66;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: bold;
        text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        line-height: 1.1;
    }

    .teams-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 10px;
        border-bottom: 2px solid #0044aa;
    }

    /* CSAPATNÉV ÉS LOGÓ */
    .team-box {
        display: flex;
        align-items: center;
        gap: 20px;
        font-size: 3.8rem;
        line-height: 1;
        color: #ffff00;
        font-weight: 900;
        text-transform: uppercase;
        text-shadow: 0 0 12px rgba(255, 255, 0, 0.5), 0 3px 6px rgba(0,0,0,0.8);
        letter-spacing: 1px;
    }
    
    .team-logo {
        height: 120px;
        width: auto;
        max-width: 180px;
        object-fit: contain;
        display: inline-block;
        filter: drop-shadow(0 3px 6px rgba(0,0,0,0.6));
    }

    .table-container {
        flex: 1;
        display: flex;
        align-items: center;
        height: 100%;
    }
    .board-table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
    }
    .board-table th { 
        color: #ffff00; 
        font-size: 1.1rem; 
        padding: 4px; 
        border-bottom: 2px solid #0044aa; 
    }
    .board-table td { 
        padding: 4px 2px; 
        text-align: center; 
        font-size: 1.6rem; 
        font-weight: bold; 
        border-bottom: 1px solid #002b66; 
        vertical-align: middle;
    }
    
    .name-col { 
        text-align: left !important; 
        color: #ffff00; 
        width: 22%; 
        font-family: sans-serif; 
        font-size: 1.4rem; 
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .name-col.right { text-align: right !important; }
    
    .val-set { color: #ffffff; }
    .val-set.win { color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.5); }
    .val-set.lose { color: #ff3333; text-shadow: 0 0 8px rgba(255, 51, 51, 0.5); }
    .val-set.draw { color: #ffff00; text-shadow: 0 0 8px rgba(255, 255, 0, 0.5); }
    
    .val-sp { color: #ffffff; font-size: 1.4rem; }
    .val-ges { color: #ffffff; font-size: 1.6rem; }
    .val-ges.win { color: #00ff66; }
    .val-mp { color: #ffff00; background-color: #00122e; font-size: 1.5rem; }
    .divider { border-left: 2px solid #0044aa; border-right: 2px solid #0044aa; }
    
    .footer-score {
        border-top: 2px solid #0044aa;
        padding-top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.3rem;
        font-family: sans-serif;
        color: #ffffff;
    }
    .footer-team-block { display: flex; gap: 20px; align-items: center; }
    .footer-label { color: #8b949e; font-size: 1.1rem; }
    .footer-val { color: #ffff00; font-weight: bold; font-size: 1.5rem; }
    
    .footer-center-group {
        display: flex;
        align-items: center;
        gap: 30px;
    }
    .total-ges-big {
        color: #ffff00;
        font-size: 2.6rem;
        font-weight: bold;
        line-height: 1;
    }
    .total-mp { 
        color: #00ff66; 
        font-size: 2.6rem; 
        font-weight: bold; 
        text-shadow: 0 0 10px rgba(0, 255, 102, 0.4); 
        line-height: 1; 
    }

    .match-divider {
        height: 6px;
        background: linear-gradient(90deg, #0044aa, #00ff66, #ffff00, #00ff66, #0044aa);
        border-radius: 3px;
        box-shadow: 0 0 12px rgba(0, 255, 102, 0.8);
        flex: 0 0 auto;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
