<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
<title>Komplett Bajnoki Kijelző (1080p)</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000c1f;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }
    .main-board {
        width: 100%;
        height: 100vh;
        padding: 12px 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 12px;
    }
    .match-block {
        background-color: #001c47;
        border: 2px solid #0044aa;
        border-radius: 10px;
        padding: 12px 20px;
        box-shadow: 0 0 20px rgba(0, 50, 150, 0.4);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }
    
    /* Magasságok arányosítása a 1080p felbontáshoz */
    #blockIfi {
        flex: 0 0 34%;
    }
    #blockAdult {
        flex: 0 0 62%;
    }

    .tournament-header {
        text-align: center;
        font-size: 1.5rem;
        color: #ffff00;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: bold;
        text-shadow: 0 0 8px rgba(255, 255, 0, 0.4);
        line-height: 1.1;
        margin-bottom: 4px;
    }
    .teams-header {
        display: flex;
        justify-content: space-between;
        font-size: 1.6rem;
        padding: 4px 10px;
        border-bottom: 2px solid #0044aa;
        color: #ffff00;
        font-weight: bold;
        text-transform: uppercase;
    }
    
    .table-container {
        flex: 1;
        display: flex;
        align-items: center;
        margin: 6px 0;
    }
    .board-table {
        width: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
    }
    .board-table th { 
        color: #ffff00; 
        font-size: 1.1rem; 
        padding: 6px 4px; 
        border-bottom: 2px solid #0044aa; 
    }
    
    /* MEGNÖVELT SOR MAGASSÁG ÉS BETŰMÉRET */
    .board-table td { 
        padding: 10px 4px; 
        text-align: center; 
        font-size: 1.6rem; 
        font-weight: bold; 
        border-bottom: 1px solid #002b66; 
    }
    
    .name-col { 
        text-align: left !important; 
        color: #ffffff; 
        width: 20%; 
        font-family: 'Segoe UI', Arial, sans-serif; 
        font-size: 1.45rem; 
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .name-col.right { text-align: right !important; }
    
    .val-set { color: #ffffff; }
    .val-set.win { color: #00ff66; text-shadow: 0 0 8px rgba(0, 255, 102, 0.5); }
    .val-set.lose { color: #ff3333; text-shadow: 0 0 8px rgba(255, 51, 51, 0.5); }
    .val-set.draw { color: #ffff00; text-shadow: 0 0 8px rgba(255, 255, 0, 0.5); }
    
    .val-sp { color: #ffffff; font-size: 1.5rem; }
    .val-ges { color: #ffffff; font-size: 1.6rem; }
    .val-ges.win { color: #00ff66; }
    .val-mp { color: #ffff00; background-color: #00122e; font-size: 1.6rem; }
    .divider { border-left: 2px solid #0044aa; border-right: 2px solid #0044aa; }
    
    .footer-score {
        border-top: 2px solid #0044aa;
        padding-top: 6px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.3rem;
        font-family: sans-serif;
        color: #ffffff;
    }
    .footer-team-block { display: flex; gap: 20px; align-items: center; }
    .footer-label { color: #8b949e; font-size: 1.1rem; }
    .footer-val { color: #ffff00; font-weight: bold; font-size: 1.5rem; }
    .total-mp { color: #00ff66; font-size: 2.6rem; font-weight: bold; text-shadow: 0 0 10px rgba(0, 255, 102, 0.4); line-height: 1; }

    /* LÁTVÁNYOS ELVÁLASZTÓ SÁV */
    .match-divider {
        height: 6px;
        background: linear-gradient(90deg, #0044aa, #00ff66, #ffff00, #00ff66, #0044aa);
        border-radius: 3px;
        box-shadow: 0 0 12px rgba(0, 255, 102, 0.8);
        flex: 0 0 auto;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="main-board">

    <div class="match-block" id="blockIfi">

            <span id="team1Ifi">HAZAI IFI</span>

                        <th class="name-col right">Név</th>
                    </tr>
                </thead>
                <tbody id="bodyIfi"></tbody>
            </table>
        </div>
        <div class="footer-score">
            <div class="footer-team-block">

                <div><span class="footer-label">Össz:</span> <span class="footer-val" id="ges1Ifi">0</span></div>
            </div>
            <div class="total-mp" id="mpIfi">0 : 0</div>
            <div class="footer-team-block">
                <div><span class="footer-label">Össz:</span> <span class="footer-val" id="ges2Ifi">0</span></div>
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp2Ifi">0</span></div>
            </div>
        </div>
    </div>

    <div class="match-divider"></div>

    <div class="match-block" id="blockAdult">

        <div class="teams-header">
            <span id="team1Adult">HAZAI</span>
            <span id="team2Adult">VENDÉG</span>
        </div>
        <div class="table-container">
            <table class="board-table">

                    <tr>

                        <th>1</th><th>2</th><th>3</th><th>4</th><th>SP</th>
                        <th>Össz.</th><th>MP</th><th>Össz.</th><th>SP</th>
                        <th>4</th><th>3</th><th>2</th><th>1</th>
                        <th class="name-col right">Név</th>
                    </tr>
                </thead>
                <tbody id="bodyAdult"></tbody>
            </table>
        </div>
        <div class="footer-score">
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp1Adult">0</span></div>
                <div><span class="footer-label">Össz:</span> <span class="footer-val" id="ges1Adult">0</span></div>
            </div>
            <div class="total-mp" id="mpAdult">0 : 0</div>
            <div class="footer-team-block">
                <div><span class="footer-label">Össz:</span> <span class="footer-val" id="ges2Adult">0</span></div>
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp2Adult">0</span></div>
            </div>
        </div>
    </div>

</div>
