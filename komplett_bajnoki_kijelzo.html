<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komplett Bajnoki Kijelző (Fix-Fit)</title>
<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    html, body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #000c1f;
        color: #ffff00;
        font-family: 'Segoe UI', Arial, sans-serif;
        user-select: none;
    }
    .main-board {
        width: 100vw;
        height: 100vh;
        padding: 0.8vh 1vw;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 0.5vh;
    }
    
    .match-block {
        background-color: #001c47;
        border: 2px solid #0044aa;
        border-radius: 6px;
        padding: 0.4vh 0.8vw;
        box-shadow: 0 0 10px rgba(0, 50, 150, 0.4);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        overflow: hidden;
    }
    
    /* Arányos blokk-magasságok: Ifi (30%), Felnőtt (68%) */
    #blockIfi { flex: 0 0 30vh; height: 30vh; }
    #blockAdult { flex: 0 0 68vh; height: 68vh; }

    /* FEJLÉCEK KORLÁTOZOTT MAGASSÁGGAL */
    .header-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        max-height: 2.5vh;
    }

    .tournament-header {
        text-align: center;
        font-size: clamp(0.9rem, 2vh, 1.4rem);
        color: #00ff66;
        letter-spacing: 1px;
        text-transform: uppercase;
        font-weight: bold;
        text-shadow: 0 0 6px rgba(0, 255, 102, 0.5);
        white-space: nowrap;
    }

    .teams-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.2vh 0.5vw;
        border-bottom: 1px solid #0044aa;
        max-height: 5.5vh;
    }

    /* CSAPATNÉV ÉS LOGÓK */
    .team-box {
        display: flex;
        align-items: center;
        gap: 0.5vw;
        font-size: clamp(0.9rem, 2.3vh, 1.8rem);
        line-height: 1;
        color: #ffff00;
        font-weight: 900;
        text-transform: uppercase;
        text-shadow: 0 0 8px rgba(255, 255, 0, 0.5);
        white-space: nowrap;
        overflow: hidden;
    }
    
    .team-logo, .matesz-logo {
        height: 4vh;
        width: auto;
        max-width: 8vw;
        object-fit: contain;
        display: inline-block;
        flex-shrink: 0;
    }

    .matesz-logo {
        height: 3.5vh;
        filter: drop-shadow(0 0 5px rgba(0, 255, 102, 0.5));
    }

    /* TÁBLÁZAT MÉRETEZÉS */
    .table-container {
        flex: 1;
        display: flex;
        align-items: center;
        overflow: hidden;
    }
    .board-table {
        width: 100%;
        height: 100%;
        border-collapse: collapse;
        font-family: 'Courier New', Courier, monospace;
    }
    
    #blockIfi .board-table th { font-size: clamp(0.6rem, 1.4vh, 1rem); padding: 0.1vh; }
    #blockIfi .board-table td { font-size: clamp(0.7rem, 1.8vh, 1.2rem); padding: 0.1vh; }

    #blockAdult .board-table th { font-size: clamp(0.6rem, 1.5vh, 1.1rem); padding: 0.2vh; }
    #blockAdult .board-table td { font-size: clamp(0.8rem, 2.2vh, 1.5rem); padding: 0.2vh; }

    .board-table th { 
        color: #ffff00; 
        border-bottom: 1px solid #0044aa; 
    }
    .board-table td { 
        text-align: center; 
        font-weight: bold; 
        border-bottom: 1px solid #002b66; 
        vertical-align: middle;
    }
    
    .name-col { 
        text-align: left !important; 
        color: #ffff00; 
        width: 20%; 
        font-family: sans-serif; 
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .name-col.right { text-align: right !important; }
    
    .val-set { color: #ffffff; }
    .val-set.win { color: #00ff66; text-shadow: 0 0 6px rgba(0, 255, 102, 0.5); }
    .val-set.lose { color: #ff3333; text-shadow: 0 0 6px rgba(255, 51, 51, 0.5); }
    .val-set.draw { color: #ffff00; text-shadow: 0 0 6px rgba(255, 255, 0, 0.5); }
    
    .val-sp { color: #ffffff; }
    .val-ges { color: #ffffff; }
    .val-ges.win { color: #00ff66; }
    .val-mp { color: #ffff00; background-color: #00122e; }
    .divider { border-left: 1px solid #0044aa; border-right: 1px solid #0044aa; }
    
    /* LÁBLÉC ALSÓ ÖSSZESÍTŐ */
    .footer-score {
        border-top: 1px solid #0044aa;
        padding-top: 0.2vh;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-family: sans-serif;
        color: #ffffff;
        max-height: 4vh;
    }
    .footer-team-block { display: flex; gap: 0.5vw; align-items: center; }
    .footer-label { color: #8b949e; font-size: clamp(0.6rem, 1.3vh, 1rem); }
    .footer-val { color: #ffff00; font-weight: bold; font-size: clamp(0.7rem, 1.6vh, 1.2rem); }
    
    .footer-center-group {
        display: flex;
        align-items: center;
        gap: 1.5vw;
    }
    .total-ges-big {
        color: #ffff00;
        font-size: clamp(0.9rem, 2.2vh, 1.8rem);
        font-weight: bold;
        line-height: 1;
    }
    .total-mp { 
        color: #00ff66; 
        font-size: clamp(0.9rem, 2.4vh, 2rem); 
        font-weight: bold; 
        text-shadow: 0 0 8px rgba(0, 255, 102, 0.4); 
        line-height: 1; 
    }

    .match-divider {
        height: 0.4vh;
        background: linear-gradient(90deg, #0044aa, #00ff66, #ffff00, #00ff66, #0044aa);
        border-radius: 2px;
        flex: 0 0 auto;
    }
</style>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="main-board">

    <!-- IFI MECCS BLOKK -->
    <div class="match-block" id="blockIfi">
        <div class="header-container">
            <div class="tournament-header" id="titleIfi">IFI BAJNOKI MÉRKŐZÉS</div>
        </div>
        <div class="teams-header">
            <div class="team-box">
                <span id="team1Ifi">HAZAI IFI</span>
                <img id="logo1Ifi" class="team-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png" alt="">
            </div>

            <img class="matesz-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/871712f3931057892c33bbc94359b6dd73762870/MATESZ_logo-removebg-preview.png" alt="MATESZ Logo">

            <div class="team-box">
                <img id="logo2Ifi" class="team-logo" src="" alt="">
                <span id="team2Ifi">VENDÉG IFI</span>
            </div>
        </div>
        <div class="table-container">
            <table class="board-table">
                <thead>
                    <tr>
                        <th class="name-col">Név</th>
                        <th>1</th><th>2</th><th>3</th><th>4</th><th>SP</th>
                        <th>Össz.</th><th>MP</th><th>Össz.</th><th>SP</th>
                        <th>4</th><th>3</th><th>2</th><th>1</th>
                        <th class="name-col right">Név</th>
                    </tr>
                </thead>
                <tbody id="bodyIfi"></tbody>
            </table>
        </div>
        <div class="footer-score">
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp1Ifi">0</span></div>
            </div>
            <div class="footer-center-group">
                <div class="total-ges-big"><span id="ges1Ifi">0</span> fa</div>
                <div class="total-mp" id="mpIfi">0 : 0</div>
                <div class="total-ges-big"><span id="ges2Ifi">0</span> fa</div>
            </div>
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp2Ifi">0</span></div>
            </div>
        </div>
    </div>

    <div class="match-divider"></div>

    <!-- FELNŐTT MECCS BLOKK -->
    <div class="match-block" id="blockAdult">
        <div class="header-container">
            <div class="tournament-header" id="titleAdult">FELNŐTT BAJNOKI MÉRKŐZÉS</div>
        </div>
        <div class="teams-header">
            <div class="team-box">
                <span id="team1Adult">HAZAI</span>
                <img id="logo1Adult" class="team-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png" alt="">
            </div>

            <img class="matesz-logo" src="https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/871712f3931057892c33bbc94359b6dd73762870/MATESZ_logo-removebg-preview.png" alt="MATESZ Logo">

            <div class="team-box">
                <img id="logo2Adult" class="team-logo" src="" alt="">
                <span id="team2Adult">VENDÉG</span>
            </div>
        </div>
        <div class="table-container">
            <table class="board-table">
                <thead>
                    <tr>
                        <th class="name-col">Név</th>
                        <th>1</th><th>2</th><th>3</th><th>4</th><th>SP</th>
                        <th>Össz.</th><th>MP</th><th>Össz.</th><th>SP</th>
                        <th>4</th><th>3</th><th>2</th><th>1</th>
                        <th class="name-col right">Név</th>
                    </tr>
                </thead>
                <tbody id="bodyAdult"></tbody>
            </table>
        </div>
        <div class="footer-score">
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp1Adult">0</span></div>
            </div>
            <div class="footer-center-group">
                <div class="total-ges-big"><span id="ges1Adult">0</span> fa</div>
                <div class="total-mp" id="mpAdult">0 : 0</div>
                <div class="total-ges-big"><span id="ges2Adult">0</span> fa</div>
            </div>
            <div class="footer-team-block">
                <div><span class="footer-label">SP:</span> <span class="footer-val" id="sp2Adult">0</span></div>
            </div>
        </div>
    </div>

</div>

<script>
const DEFAULT_HAZAI_LOGO = "https://raw.githubusercontent.com/tvseteke-tse/Komplett-bajnoki/main/ttse.png";

const firebaseConfig = {
    apiKey: "aizasyd8o7xyctxtjlqcm8z-29xtbopbxrybjom",
    authDomain: "teke-eredmenyek.firebaseapp.com",
    databaseURL: "https://teke-eredmenyek-default-rtdb.firebaseio.com",
    projectId: "teke-eredmenyek",
    storageBucket: "teke-eredmenyek.appspot.com"
};

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();

db.ref('osszevont_bajnoki_bowling').on('value', (snapshot) => {
    const data = snapshot.val();
    if (data) {
        if (data.ifi) renderSection('Ifi', data.ifi);
        if (data.adult) renderSection('Adult', data.adult);
    }
});

function getSetClass(val1, val2) {
    if (val1 === 0 && val2 === 0) return 'val-set';
    if (val1 > val2) return 'val-set win';
    if (val1 < val2) return 'val-set lose';
    return 'val-set draw';
}

function updateLogo(elementId, logoUrl, fallbackUrl = '') {
    const imgEl = document.getElementById(elementId);
    const targetUrl = (logoUrl && logoUrl.trim() !== '') ? logoUrl : fallbackUrl;
    
    if (targetUrl) {
        imgEl.src = targetUrl;
        imgEl.style.display = 'inline-block';
    } else {
        imgEl.style.display = 'none';
        imgEl.src = '';
    }
}

function renderSection(type, sectionData) {
    if (sectionData.title) document.getElementById(`title${type}`).innerText = sectionData.title.toUpperCase();
    document.getElementById(`team1${type}`).innerText = sectionData.team1 || 'HAZAI';
    document.getElementById(`team2${type}`).innerText = sectionData.team2 || 'VENDÉG';

    updateLogo(`logo1${type}`, sectionData.logo1, DEFAULT_HAZAI_LOGO);
    updateLogo(`logo2${type}`, sectionData.logo2);

    const tbody = document.getElementById(`body${type}`);
    tbody.innerHTML = '';

    let totalGes1 = 0, totalGes2 = 0;
    let totalSp1 = 0, totalSp2 = 0;
    let totalMp1 = 0, totalMp2 = 0;

    if (sectionData.pairs && Array.isArray(sectionData.pairs)) {
        sectionData.pairs.forEach(row => {
            const sum1 = row.p1Sets.reduce((a, b) => a + b, 0);
            const sum2 = row.p2Sets.reduce((a, b) => a + b, 0);

            let sp1 = 0, sp2 = 0;
            row.p1Sets.forEach((s1, idx) => {
                const s2 = row.p2Sets[idx];
                if (s1 > s2) sp1 += 1;
                else if (s2 > s1) sp2 += 1;
                else if (s1 > 0 || s2 > 0) { sp1 += 0.5; sp2 += 0.5; }
            });

            let mp1 = 0, mp2 = 0;
            if (sum1 > 0 || sum2 > 0) {
                if (sp1 > sp2) mp1 = 1;
                else if (sp2 > sp1) mp2 = 1;
                else if (sum1 > sum2) mp1 = 1;
                else if (sum2 > sum1) mp2 = 1;
                else { mp1 = 0.5; mp2 = 0.5; }
            }

            totalGes1 += sum1; totalGes2 += sum2;
            totalSp1 += sp1; totalSp2 += sp2;
            totalMp1 += mp1; totalMp2 += mp2;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td class="name-col">${row.p1Name || '-'}</td>
                ${row.p1Sets.map((s1, i) => `<td class="${getSetClass(s1, row.p2Sets[i])}">${s1 || ''}</td>`).join('')}
                <td class="val-sp">${sp1}</td>
                <td class="val-ges ${sum1 > sum2 && sum1 > 0 ? 'win' : ''}">${sum1}</td>
                <td class="val-mp divider">${mp1}:${mp2}</td>
                <td class="val-ges ${sum2 > sum1 && sum2 > 0 ? 'win' : ''}">${sum2}</td>
                <td class="val-sp">${sp2}</td>
                ${row.p2Sets.slice().reverse().map((s2, i) => {
                    const origIdx = 3 - i;
                    return `<td class="${getSetClass(s2, row.p1Sets[origIdx])}">${s2 || ''}</td>`;
                }).join('')}
                <td class="name-col right">${row.p2Name || '-'}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    let teamBonus1 = 0, teamBonus2 = 0;
    if (totalGes1 > totalGes2) teamBonus1 = 2;
    else if (totalGes2 > totalGes1) teamBonus2 = 2;
    else if (totalGes1 > 0 || totalGes2 > 0) { teamBonus1 = 1; teamBonus2 = 1; }

    document.getElementById(`sp1${type}`).innerText = totalSp1;
    document.getElementById(`sp2${type}`).innerText = totalSp2;
    document.getElementById(`ges1${type}`).innerText = totalGes1;
    document.getElementById(`ges2${type}`).innerText = totalGes2;
    document.getElementById(`mp${type}`).innerText = `${totalMp1 + teamBonus1} : ${totalMp2 + teamBonus2}`;
}
</script>
</body>
</html>
